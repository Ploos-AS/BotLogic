name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go mod tidy
      - run: |\n          git diff --exit-code -- go.mod go.sum\n          test -f go.sum\n          test -z "$(git status --porcelain -- go.mod go.sum)"
      - run: go test ./...
      - run: go vet ./...
      - run: docker build -t botlogic:test .
